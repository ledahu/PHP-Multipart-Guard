# =====================================================================
#  MULTIPART GUARD — dedicated log
#
#  Writes one line per upload request (multipart), for every VirtualHost,
#  even those with their own CustomLog. Needs Apache 2.4.19 or later.
#  Request bodies, query strings and cookies are never logged.
#
#  This file must be in the SERVER configuration (it cannot go in .htaccess).
#    WAMP:            copy it to c:/wamp64/alias/ and restart Apache.
#    Debian/Ubuntu:   copy it to /etc/apache2/conf-available/, then
#                     a2enconf multipart-guard-log && systemctl reload apache2
#  To remove it: delete the file (or a2disconf) and restart/reload Apache.
#
#  Fields:
#    action   decision: allow, deny_not_allowed, deny_method,
#             deny_bad_ctype, deny_no_length, deny_too_large
#    observe  1 if OBSERVE mode was on, else "-". LimitRequestBody stays active.
#    status   HTTP status sent to the client (403 = blocked)
#    ip       client address seen by Apache. Behind a reverse proxy this is
#             the real client only if mod_remoteip is set up
#             (RemoteIPHeader + RemoteIPTrustedProxy).
#    peer     address of the TCP connection (the proxy, if there is one)
#    method, uri, ctype, cl (Content-Length), te (Transfer-Encoding)
#
#  "action" and "method" come from the original request ("%<"), not from
#  an internal redirect (an ErrorDocument turns a POST into a GET).
# =====================================================================

<IfModule log_config_module>
    LogFormat "%{%Y-%m-%dT%H:%M:%S}t%{%z}t MULTIPART_GUARD action=%<{MPG}e observe=%<{MPG_OBSERVE}e status=%>s ip=%a peer=%{c}a host=%v method=%<m uri=\"%U\" ctype=\"%{Content-Type}i\" cl=%{Content-Length}i te=%{Transfer-Encoding}i" multipart_guard
    GlobalLog "${INSTALL_DIR}/logs/multipart-guard.log" multipart_guard "expr=-n %{ENV:MPG} || -n %{ENV:REDIRECT_MPG}"
</IfModule>
