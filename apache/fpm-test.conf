# Banc de test "type PHP-FPM" : Apache -> mod_proxy_fcgi -> serveur FastCGI
# séparé (php-cgi -b 127.0.0.1:9074, PHP 7.4). Sous Linux ce serait PHP-FPM.
#
# À copier dans c:/wamp64/alias/ puis redémarrer Apache.
# Retrait : supprimer le fichier, redémarrer Apache.

<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_fcgi_module>
    LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
</IfModule>

# Branchement 1 — SetHandler (dans site-fpm/.htaccess) : rien à faire ici.

# Branchement 2 — ProxyPassMatch (site-ppm/) : la requête est envoyée au
# backend dès la traduction de l'URL, sans passer par le système de fichiers.
ProxyPassMatch "^/multipart2hell/site-ppm/(.*\.php)$" "fcgi://127.0.0.1:9074/C:/wamp64/www/multipart2hell/site-ppm/$1"

# php-cgi (contrairement à PHP-FPM) ne sait pas lire un SCRIPT_FILENAME
# préfixé par "proxy:fcgi://..." : on le recalcule.
<Proxy "fcgi://127.0.0.1:9074">
    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "C:/wamp64/www%{reqenv:SCRIPT_NAME}"
</Proxy>

# Multipart Guard au niveau serveur pour site-ppm : le .htaccess n'y est
# jamais lu (ProxyPassMatch court-circuite le système de fichiers), mais les
# sections <Location> sont toujours évaluées. Même fichier de règles.
<Location "/multipart2hell/site-ppm/">
    Include "C:/wamp64/www/multipart2hell/apache/guard-site-ppm.conf"
</Location>
